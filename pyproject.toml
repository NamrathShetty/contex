[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctxvc"
description = "Git-style local version control for LLM context files and knowledge graphs"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Namrath Shetty" }]
keywords = [
    "llm",
    "version-control",
    "prompt-engineering",
    "context",
    "knowledge-graph",
    "embeddings",
    "vector-search",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Typing :: Typed",
]
dynamic = ["version"]
dependencies = [
    "networkx>=2.8",
]

[project.optional-dependencies]
tokens = ["tiktoken>=0.5"]
semantic = ["sentence-transformers>=2.2"]
s3 = ["boto3>=1.34"]
qdrant = ["qdrant-client>=1.7"]
all = [
    "tiktoken>=0.5",
    "sentence-transformers>=2.2",
    "boto3>=1.34",
    "qdrant-client>=1.7",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "build>=1.2",
    "qdrant-client>=1.7",
    "tiktoken>=0.5",
]

[project.scripts]
ctxvc = "ctxvc.cli:main"

[project.urls]
Homepage = "https://github.com/namrathshetty/ctxvc"
Repository = "https://github.com/namrathshetty/ctxvc"
Issues = "https://github.com/namrathshetty/ctxvc/issues"
Changelog = "https://github.com/namrathshetty/ctxvc/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.dynamic]
version = { attr = "ctxvc.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ctxvc = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
check_untyped_defs = true
files = ["src/ctxvc"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["ctxvc"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true